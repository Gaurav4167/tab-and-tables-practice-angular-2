<!-- Event Binding -->

<div class="container">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card shadow">
                <div class="card-body">
                    <form #formReference>
                        <h3 class="text-center">Form</h3>

                        <label class="mt-2" for="pName"><b>Name:</b> </label>
                        <input #productName class="form-control" id="pName" type="text" placeholder="Enter Product">

                        <label class="mt-3" for="price"><b>Price:</b> </label>
                        <input #price class="form-control" id="price" type="number" placeholder="eg. 25000">

                        <button type="submit" (click)="onAddNewProduct($event, productName,price, formReference)" class="btn btn-primary mt-4">Add
                            Product</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container mt-3">
    <div class="row">
        <div class="col-md-6 offset-md-3" *ngIf="pName; else emptyResult">
            <div class="card shadow alert alert-info">
                <div class="card-body">
                    <p>Product {{pName}} with {{pPrice}} is added successfully !!!</p>
                </div>
            </div>
        </div>
        
        <ng-template #emptyResult>
            <div class="col-md-6 offset-md-3">
                <div class="card shadow alert alert-info">
                    <div class="card-body">
                        <p>No Product Information</p>
                    </div>
                </div>
            </div>
        </ng-template>
    </div>
</div>
