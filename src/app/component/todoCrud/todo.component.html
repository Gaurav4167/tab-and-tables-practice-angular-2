<div class="container">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card mt-5">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-10 offset-md-1">
                            <label class="" for=""><b>TodoItem: </b></label>
                            <input #todoInputReference class="w-100 p-2 form-group" type="text" placeholder="Enter Todo Item">

                            <button *ngIf="!isInEditMode" (click)="onAddNewTodo(todoInputReference)" class="btn btn-primary shadow w-100">Add Todo</button>
                            <button *ngIf="isInEditMode" (click)="onUpdateTodo()" class="btn btn-primary shadow w-100">Update Todo</button>
                        </div>

                    </div>
                    <div class="row">
                        <div class="col-md-6"  *ngFor="let todo of todosArr">
                            <div class="card mt-4">
                                <div class="card-body">
                                    <div class="justify-content-between d-flex">
                                        <div>
                                            <h3> {{todo.todoItem}} </h3>
                                        </div>
                                        <div class="">
                                            <mat-chip-list aria-label="Fish selection">
                                                <mat-chip class="bg-warning" (click) = "onEditTodo(todo)">edit</mat-chip>

                                                <mat-chip (click)="onRemoveTodo(todo.id)" class="bg-danger text-white">delete</mat-chip>
                                            </mat-chip-list>
                                            <!-- <button (click)="">Edit</button> -->
                                        </div>
                                    </div> 
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
